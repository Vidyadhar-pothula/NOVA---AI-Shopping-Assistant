services:
  - type: web
    name: nova-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEBUG
        value: "false"
      - key: SERP_API_KEY
        sync: false
      - key: COMMERCE_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
