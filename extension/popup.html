<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand">
      <span class="mark">N</span>
      <div>
        <h1>NOVA</h1>
        <p>Shopping assistant extension</p>
      </div>
    </div>
    <div class="status">
      <span id="dot"></span>
      <span id="status-text">Checking backend...</span>
    </div>
    <p class="copy">Open a supported shopping website and use the floating NOVA button in the bottom-right corner.</p>
    <button id="open-localhost" type="button">Open NOVA app</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
